<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <h1>Memory Card Game</h1>

    <div class="stats-bar">
      <div class="timer-box" aria-live="polite">
        <span class="stat-label">Time</span>
        <span id="timerDisplay" class="stat-value">00:00</span>
      </div>
      <div class="timer-box">
        <span class="stat-label">Pairs</span>
        <span id="pairsDisplay" class="stat-value">0 / 20</span>
      </div>
    </div>

    <div id="game-board" class="game-board"></div>

    <div class="button-row">
      <button id="resetButton" type="button">Reset Game</button>
      <button id="leaderboardButton" type="button">Leaderboard</button>
    </div>
  </div>

  <div class="credit">
    <p>Designed by: Mr Ismail<br>S3-1</p>
  </div>

  <div id="foodPreview" class="food-preview hidden">
    <img id="foodPreviewImage" alt="Food preview">
    <p id="foodPreviewName"></p>
  </div>

  <div id="nameModal" class="modal hidden" role="dialog" aria-labelledby="nameModalTitle" aria-modal="true">
    <div class="modal-content">
      <h2 id="nameModalTitle">You finished!</h2>
      <p id="finalTimeText">Your time: 00:00</p>
      <label for="playerName">Enter your name for the leaderboard</label>
      <input id="playerName" type="text" maxlength="20" placeholder="Your name" autocomplete="nickname">
      <div class="modal-actions">
        <button id="saveScoreButton" type="button">Save Score</button>
        <button id="skipSaveButton" type="button" class="secondary">Skip</button>
      </div>
    </div>
  </div>

  <div id="leaderboardModal" class="modal hidden" role="dialog" aria-labelledby="leaderboardTitle" aria-modal="true">
    <div class="modal-content">
      <h2 id="leaderboardTitle">Fastest Times</h2>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
      <p id="emptyLeaderboard" class="empty-note hidden">No scores yet. Finish a game to appear here.</p>
      <div class="reset-scores-box">
        <label for="leaderboardPassword">Admin password to reset scores</label>
        <input id="leaderboardPassword" type="password" placeholder="Password">
        <p id="passwordError" class="password-error hidden">Incorrect password.</p>
      </div>
      <div class="modal-actions">
        <button id="clearLeaderboardButton" type="button" class="secondary">Reset Leaderboard</button>
        <button id="closeLeaderboardButton" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
